name: CI

on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the exact wheel-only test and build dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements-tools.txt
      - run: python -m pytest
      - name: Audit the complete locked dependency closure
        run: python tests/audit_lock.py
      - name: Validate a fresh wheel outside the source checkout
        run: python tests/check_wheel.py
